name: build

on:
  push:
    branches: [main, ci-gha]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get-versions.outputs.versions }}
    steps:
      - name: Discover available IDA versions
        id: get-versions
        shell: bash
        run: |
          # The SDK repo tags every IDA release as vX.Y.Z-release and SDK-only
          # follow-ups as vX.Y.Z-sdk.N. Extract the unique IDA X.Y versions.
          versions=$(git ls-remote --tags --refs https://github.com/HexRaysSA/ida-sdk \
            | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+-(release|sdk\.[0-9]+)$' \
            | sed -E 's/^v([0-9]+\.[0-9]+)\..*/\1/' \
            | sort -Vu \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "Discovered IDA versions: $versions"

  build:
    needs: discover
    permissions:
      contents: write
    name: IDA ${{ matrix.ida_version }} on ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ida_version: ${{ fromJson(needs.discover.outputs.versions) }}
        os:
          - ubuntu-latest
          - windows-2022
          - macos-latest
        include:
          - os: ubuntu-latest
            os_name: "linux"
          - os: windows-2022
            os_name: "windows"
          - os: macos-latest
            os_name: "macos"

    steps:
      - name: Setup MSBuild
        if: matrix.os_name == 'windows'
        uses: microsoft/setup-msbuild@v1.1

      - name: Setup Visual Studio 2022
        if: matrix.os_name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: 2022

      - name: Setup uv
        # on act, need use v5 instead of v6, due to:
        # https://github.com/astral-sh/setup-uv/issues/535
        # (ultimately an issue with act images)
        uses: astral-sh/setup-uv@v5

      - name: Fetch IDA SDK ${{ matrix.ida_version }}
        shell: bash
        env:
          IDA_VERSION: ${{ matrix.ida_version }}
        run: |
          # Use the newest SDK tag targeting this IDA version. sort -V orders
          # vX.Y.Z-release before vX.Y.Z-sdk.N, i.e. chronologically.
          SDK_TAG=$(git ls-remote --tags --refs https://github.com/HexRaysSA/ida-sdk \
            | grep -oE "v${IDA_VERSION}\.[0-9]+-(release|sdk\.[0-9]+)$" \
            | sort -V | tail -1)
          if [ -z "$SDK_TAG" ]; then
            echo "ERROR: no SDK tag found for IDA $IDA_VERSION"
            exit 1
          fi
          echo "Using SDK tag: $SDK_TAG"

          # Only check out the headers and this platform's stub libraries.
          case "$RUNNER_OS" in
            Linux)   LIB_DIRS="/src/lib/x64_linux*_64/" ;;
            macOS)   LIB_DIRS="/src/lib/*_mac*_64/" ;;
            Windows) LIB_DIRS="/src/lib/x64_win*_64/" ;;
          esac
          git -c advice.detachedHead=false clone --quiet --depth 1 --filter=blob:none --sparse --branch "$SDK_TAG" \
            https://github.com/HexRaysSA/ida-sdk ida-sdk-git
          printf '%s\n' /src/include/ /src/plugins/exports.def "$LIB_DIRS" \
            | git -C ida-sdk-git sparse-checkout set --no-cone --stdin
          mv ida-sdk-git/src ./ida-sdk
          rm -rf ida-sdk-git

          if [ ! -f ida-sdk/include/pro.h ]; then
            echo "ERROR: include/pro.h missing from the SDK checkout"
            exit 1
          fi
          echo "SDK lib dirs:"
          ls ida-sdk/lib

      - name: Checkout bindiff
        # on act, need use v4 instead of v5 due to node24 reference
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"
          path: bindiff

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Install Ninja
        run: uv tool install ninja

      - name: Checkout BinExport
        uses: actions/checkout@v4
        with:
          repository: google/binexport
          path: binexport
          ref: 644786690fcb6bcf6d42a76e7d8b65056176054d

      - name: Patch BinExport FindIdaSdk for open-sourced SDK (9.4+) lib dirs
        shell: bash
        run: |
          cd binexport
          git apply --verbose ../bindiff/.github/patches/binexport-findidasdk-sdk94-libdirs.patch

      # There's a bug in BinExport's IDA 9+ support on macOS
      # reported here: https://github.com/google/binexport/issues/159
      - name: Patch BinExport for IDA SDK 9.x on macOS
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          cd binexport
          git apply --verbose ../bindiff/.github/patches/binexport-bdb8c4430549e69d4a9a7531c59b197f3a0757e6.patch

      - name: Configure BinDiff build
        working-directory: ./bindiff/
        shell: bash
        run: |
          # Build universal binaries on macOS (both arm64 and x86_64)
          if [ "${{ matrix.os_name }}" = "macos" ]; then
            CMAKE_EXTRA_FLAGS="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          else
            CMAKE_EXTRA_FLAGS=""
          fi

          cmake -S . -B ../build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=../install \
            -DBINDIFF_BINEXPORT_DIR=../binexport \
            "-DIdaSdk_ROOT_DIR=$PWD/../ida-sdk" \
            $CMAKE_EXTRA_FLAGS

      - name: Build BinDiff
        shell: bash
        run: |
          cmake --build build --config Release --parallel 4

      - name: Run tests
        shell: bash
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Install BinDiff
        shell: bash
        run: cmake --install build --config Release

      - name: Collect artifacts
        working-directory: ./bindiff/
        shell: bash
        run: |
          mkdir -p ../artifacts
          cp -v ../install/bindiff-prefix/* ../artifacts/
          jq '.plugin.idaVersions = "==${{ matrix.ida_version }}"' ida/ida-plugin.json > ../artifacts/ida-plugin.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bindiff-ida${{ matrix.ida_version }}-${{ matrix.os_name }}
          path: artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [discover, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create per-version archives
        shell: bash
        run: |
          versions='${{ needs.discover.outputs.versions }}'
          for version in $(echo "$versions" | jq -r '.[]'); do
            echo "Creating archive for IDA $version..."
            mkdir -p "stage-${version}"

            # Merge artifacts from all OSes for this version
            for dir in artifacts/bindiff-ida${version}-*/; do
              [ -d "$dir" ] && cp -v "$dir"/* "stage-${version}/"
            done

            # Remove non-plugin files
            rm -f "stage-${version}/bindiff" "stage-${version}/bindiff.exe"
            rm -f "stage-${version}"/bindiff_config_setup*
            rm -f "stage-${version}"/bindiff_launcher_macos

            cd "stage-${version}"
            zip -r "../bindiff-ida${version}.zip" *
            cd ..
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: bindiff-ida*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
